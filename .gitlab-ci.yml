# SPDX-FileCopyrightText: 2023-2025 Univention GmbH

variables:
  TAGGED_RELEASE: "true"

include:
  - project: "univention/dev/nubus-for-k8s/common-ci"
    ref: "v1.68.2"
    file:
      - "defaults/stages.yaml"
      - "defaults/nubus-workflow.yaml"
      - "jobs/check-debian-updates.yaml"
      - "jobs/container-build-external-buildkit.yaml"
      - "jobs/lint-commit-messages.yaml"
      - "jobs/lint-pre-commit-legacy.yaml"
      - "templates/tagged-release.yaml"
      - "jobs/package-and-publish-helm-charts-external.yaml"
      - "templates/sonarqube.yaml"
  - component: "$CI_SERVER_FQDN/univention/dev/nubus-for-k8s/common-ci/vul-man@v1.68.2"
    inputs:
      helm_chart_name: "intercom-service"
      helm_values: "--helm-values ${CI_PROJECT_DIR}/helm/intercom-service/linter_values.yaml"
  - component: "$CI_SERVER_FQDN/univention/dev/tooling/ci-components/app-release@2.20.2"
    inputs:
      app_id: "intercom-service"
      ucs_base_version: "5.0"
      changelog_link: "https://docs.software-univention.de/intercom-service/${APP_VERSION}/changelog.html"
      mail_recipient: "app-announcement@univention.de"
      mail_sender: "nubus-core@univention.de"
      author_alias: "Nubus Core Team"
      appcenter_file_dir: "appcenter/"
      release_tag_prefix: "v"
      app_version_from_branch_name: true
      build_stage: "package"
      release_stage: "publish"
      cleanup_stage: ".post"
      additional_update_appcenter_needs:
        - job: "container-build"
          parallel:
            matrix:
              - IMAGE_NAME: "intercom-service"
                BUILD_CONTEXT: "$CI_PROJECT_DIR/intercom"
                DOCKERFILE_PATH: "docker/intercom-service/Dockerfile"
        - "pre-semantic-release"

pre-semantic-release:
  extends: ".tagged-release"

trigger-docs:
  stage: "trigger"
  variables:
    RELEASE_VERSION: "${RELEASE_VERSION}"
    PUBLIC_RELEASE: "${PUBLIC_RELEASE}"
    DOCS_DIR: "docs"
    LANG: "C.UTF-8"
    DEBIAN_FRONTEND: "noninteractive"
    UNIVENTION_BASECONF: "/dev/null"
    DOC_TARGET_NAME: "intercom-service"
    DOC_TARGET_VERSION: "${RELEASE_VERSION}"
    DOC_TARGET_PATH: "$DOC_TARGET_NAME/$DOC_TARGET_VERSION"
  trigger:
    include:
      - local: ".gitlab-ci.docs.yml"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: "never"
    - changes:
        - "$DOCS_DIR/**/*"

lint-pre-commit-full:
  rules:
    - when: never

lint-pre-commit-legacy:
  before_script:
    - helm repo add bitnami "https://charts.bitnami.com/bitnami"

.build-matrix: &build-matrix
  - IMAGE_NAME:
      - "intercom-service"
    BUILD_CONTEXT: "$CI_PROJECT_DIR/intercom"
    DOCKERFILE_PATH: "docker/intercom-service/Dockerfile"

container-build:
  parallel:
    matrix: *build-matrix

container-malware-scan:
  parallel:
    matrix: *build-matrix

container-sign-external:
  parallel:
    matrix: *build-matrix

push-image-external:
  parallel:
    matrix: *build-matrix

container-release-attestation:
  parallel:
    matrix: *build-matrix

chart-tests:
  image: "gitregistry.knut.univention.de/univention/dev/nubus-for-k8s/common-helm/testrunner:0.29.10@sha256:5cba2a8fc4c6d5fa82bcec177ad433ab74695b4e02b2a2e9ed9b53c734b34dbf"
  stage: "test"
  needs: []
  script:
    - "helm dep build helm/intercom-service"
    - "pytest -vv helm-unittests"

sonarqube:
  extends: .sonarqube
  needs: []

sbom-scan-and-upload:
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/'
      variables:
        HELM_REPOSITORY_URL: "oci://artifacts.software-univention.de/nubus/charts"
    - when: "never"

sbom-scan-and-upload-mr:
  rules:
    - if: '$CI_COMMIT_TAG'
      when: "never"
    - if: '$CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH'
      variables:
        HELM_REPOSITORY_URL: "oci://artifacts.software-univention.de/nubus-dev/charts"
    - when: "never"

clean-up-dt-tag:
  rules:
    - if: '$CI_COMMIT_TAG'
      when: "never"
    - if: '$CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH'
      when: "manual"
      allow_failure: true
    - when: "never"

validate-vulnerabilities:
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - when: "never"

sbom-vex-attest:
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: "manual"
      allow_failure: true
    - when: "never"

create_app_version:
  environment:
    auto_stop_in: "3 days"
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/'
      variables:
        ENVIRONMENT_NAME: "release-app/${APP_ID}_$CI_COMMIT_TAG"
    - if: '$CI_MERGE_REQUEST_ID'
      when: "manual"
      allow_failure: true
      variables:
        ENVIRONMENT_NAME: "branch-app/${APP_ID}_$CI_COMMIT_REF_SLUG"
    - if: '$CI_COMMIT_REF_NAME == $CI_DEFAULT_BRANCH'
      variables:
        ENVIRONMENT_NAME: "staging-app/${APP_ID}_999.0.0-staging"

update_appcenter:
  before_script:
    - |
      INTERCOM_SERVICE_IMAGE_DIGEST=""
      if [ -f "${CI_PROJECT_DIR}/digests/intercom-service" ]; then
        INTERCOM_SERVICE_IMAGE_DIGEST="$(cat "${CI_PROJECT_DIR}/digests/intercom-service")"
      fi
      echo "intercom-service image digest: ${INTERCOM_SERVICE_IMAGE_DIGEST:-<none, tag only>}"
      export INTERCOM_SERVICE_IMAGE_DIGEST

send_chat_message:
  rules:
    - when: never

...
